<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASE Study Q&A - A1 to A8 & G1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #0f3460, #16213e);
  padding: 15px 20px;
  text-align: center;
  border-bottom: 3px solid #e94560;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 {
  font-size: 1.5rem;
  color: #fff;
  margin-bottom: 8px;
}
.header .subtitle {
  font-size: 0.85rem;
  color: #a0a0c0;
}
.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
  padding: 12px 10px;
  background: #16213e;
  border-bottom: 2px solid #0f3460;
  position: sticky;
  top: 72px;
  z-index: 99;
}
.tab {
  padding: 10px 18px;
  border: 2px solid #0f3460;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 700;
  transition: all 0.3s;
  background: #1a1a2e;
  color: #a0a0c0;
  user-select: none;
}
.tab:hover {
  background: #0f3460;
  color: #fff;
  transform: translateY(-2px);
}
.tab.active {
  background: #e94560;
  color: #fff;
  border-color: #e94560;
  box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
}
.tab .tab-label {
  display: block;
  font-size: 0.65rem;
  font-weight: 400;
  margin-top: 2px;
  opacity: 0.8;
}
.main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.score-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #16213e;
  border-radius: 12px;
  padding: 12px 20px;
  margin-bottom: 20px;
  border: 1px solid #0f3460;
}
.score-item {
  text-align: center;
}
.score-item .label {
  font-size: 0.75rem;
  color: #a0a0c0;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.score-item .value {
  font-size: 1.4rem;
  font-weight: 700;
  color: #fff;
}
.score-item .value.correct { color: #4ecca3; }
.score-item .value.wrong { color: #e94560; }
.score-item .value.total { color: #f0c040; }
.progress-bar {
  width: 100%;
  height: 6px;
  background: #0f3460;
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4ecca3, #45b7d1);
  border-radius: 3px;
  transition: width 0.5s ease;
}
.question-card {
  background: #16213e;
  border-radius: 16px;
  padding: 30px;
  border: 1px solid #0f3460;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
.question-number {
  display: inline-block;
  background: #e94560;
  color: #fff;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
  margin-bottom: 15px;
}
.question-topic {
  display: inline-block;
  background: #0f3460;
  color: #45b7d1;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  margin-left: 8px;
  margin-bottom: 15px;
}
.question-text {
  font-size: 1.15rem;
  line-height: 1.6;
  color: #fff;
  margin-bottom: 25px;
}
.question-diagram {
  text-align: center;
  margin-bottom: 20px;
  padding: 15px;
  background: #1a1a2e;
  border-radius: 10px;
  border: 1px solid #0f3460;
}
.question-diagram svg {
  max-width: 100%;
  height: auto;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 25px;
}
.option {
  padding: 15px 20px;
  background: #1a1a2e;
  border: 2px solid #0f3460;
  border-radius: 10px;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1.5;
  transition: all 0.3s;
  position: relative;
}
.option:hover:not(.disabled) {
  border-color: #45b7d1;
  background: #0f3460;
  transform: translateX(5px);
}
.option.selected {
  border-color: #45b7d1;
  background: rgba(69, 183, 209, 0.15);
}
.option.correct {
  border-color: #4ecca3;
  background: rgba(78, 204, 163, 0.15);
}
.option.correct::after {
  content: '\u2713';
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #4ecca3;
  font-size: 1.4rem;
  font-weight: 700;
}
.option.wrong {
  border-color: #e94560;
  background: rgba(233, 69, 96, 0.15);
}
.option.wrong::after {
  content: '\u2717';
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #e94560;
  font-size: 1.4rem;
  font-weight: 700;
}
.option.disabled {
  cursor: default;
  opacity: 0.7;
}
.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  padding: 12px 30px;
  border: none;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-answer {
  background: linear-gradient(135deg, #e94560, #c23152);
  color: #fff;
}
.btn-answer:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(233,69,96,0.4); }
.btn-answer:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-next {
  background: linear-gradient(135deg, #4ecca3, #38a88a);
  color: #fff;
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(78,204,163,0.4); }
.btn-reset {
  background: linear-gradient(135deg, #f0c040, #d4a017);
  color: #1a1a2e;
}
.btn-reset:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(240,192,64,0.4); }
.explanation {
  margin-top: 20px;
  padding: 20px;
  background: #1a1a2e;
  border-radius: 12px;
  border-left: 4px solid #4ecca3;
  display: none;
}
.explanation.show { display: block; animation: fadeIn 0.4s ease; }
.explanation h3 {
  color: #4ecca3;
  margin-bottom: 10px;
  font-size: 1.05rem;
}
.explanation p {
  line-height: 1.7;
  font-size: 1rem;
  color: #c0c0d0;
}
.explanation .diagram-explain {
  margin-top: 15px;
  text-align: center;
  padding: 10px;
  background: #16213e;
  border-radius: 8px;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.no-questions {
  text-align: center;
  padding: 60px 20px;
  color: #a0a0c0;
}
.no-questions h2 { margin-bottom: 10px; color: #fff; }

/* Mobile responsive */
@media (max-width: 600px) {
  .tabs { gap: 3px; padding: 8px 5px; }
  .tab { padding: 8px 10px; font-size: 0.85rem; }
  .tab .tab-label { display: none; }
  .question-card { padding: 20px 15px; }
  .question-text { font-size: 1.05rem; }
  .header h1 { font-size: 1.2rem; }
  .score-bar { flex-wrap: wrap; gap: 8px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>ASE Certification Study Q&A</h1>
  <div class="subtitle">Entry-Level Technician Certification Prep | A1-A8 & G1 | 900 Questions</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="main">
  <div class="score-bar" id="scoreBar">
    <div class="score-item">
      <div class="label">Correct</div>
      <div class="value correct" id="scoreCorrect">0</div>
    </div>
    <div class="score-item">
      <div class="label">Wrong</div>
      <div class="value wrong" id="scoreWrong">0</div>
    </div>
    <div class="score-item">
      <div class="label">Answered</div>
      <div class="value total" id="scoreAnswered">0</div>
    </div>
    <div class="score-item">
      <div class="label">Remaining</div>
      <div class="value" id="scoreRemaining">100</div>
    </div>
    <div class="score-item" style="flex: 1; max-width: 200px;">
      <div class="label">Progress</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="no-questions">
      <h2>Select a test section above to begin</h2>
      <p>Choose from A1-A8 or G1 to start studying</p>
    </div>
  </div>
</div>

<script src="q_a1.js"></script>
<script src="q_a2.js"></script>
<script src="q_a3.js"></script>
<script src="q_a4.js"></script>
<script src="q_a5.js"></script>
<script src="q_a6.js"></script>
<script src="q_a7.js"></script>
<script src="q_a8.js"></script>
<script src="q_g1.js"></script>

<script>
const sections = [
  { id: 'A1', label: 'Engine Repair', data: () => questionsA1 },
  { id: 'A2', label: 'Auto Trans', data: () => questionsA2 },
  { id: 'A3', label: 'Manual Drive', data: () => questionsA3 },
  { id: 'A4', label: 'Susp & Steer', data: () => questionsA4 },
  { id: 'A5', label: 'Brakes', data: () => questionsA5 },
  { id: 'A6', label: 'Electrical', data: () => questionsA6 },
  { id: 'A7', label: 'HVAC', data: () => questionsA7 },
  { id: 'A8', label: 'Engine Perf', data: () => questionsA8 },
  { id: 'G1', label: 'Maint & Lt Repair', data: () => questionsG1 }
];

let currentSection = null;
let currentQuestions = [];
let currentQuestion = null;
let selectedOption = -1;
let answered = false;
let scores = {};

// Initialize scores for each section
sections.forEach(s => {
  scores[s.id] = { correct: 0, wrong: 0, answered: new Set(), pool: [] };
});

// Build tabs
const tabsEl = document.getElementById('tabs');
sections.forEach(s => {
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.innerHTML = `${s.id}<span class="tab-label">${s.label}</span>`;
  tab.onclick = () => selectSection(s.id);
  tab.id = `tab-${s.id}`;
  tabsEl.appendChild(tab);
});

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectSection(sectionId) {
  currentSection = sectionId;
  const section = sections.find(s => s.id === sectionId);

  // Update tab active state
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${sectionId}`).classList.add('active');

  // Initialize pool if needed
  if (scores[sectionId].pool.length === 0) {
    try {
      const allQ = section.data();
      scores[sectionId].pool = shuffle(allQ);
    } catch(e) {
      document.getElementById('questionCard').innerHTML = `
        <div class="no-questions">
          <h2>Loading questions...</h2>
          <p>Questions for ${sectionId} are still loading. Please try again.</p>
        </div>`;
      return;
    }
  }

  answered = false;
  selectedOption = -1;
  showRandomQuestion();
}

function showRandomQuestion() {
  const sectionId = currentSection;
  const score = scores[sectionId];
  const pool = score.pool;

  // Find unanswered questions first, otherwise pick any random one
  let unanswered = pool.filter(q => !score.answered.has(q.id));
  let q;
  if (unanswered.length > 0) {
    q = unanswered[Math.floor(Math.random() * unanswered.length)];
  } else {
    // All answered, pick random for review
    q = pool[Math.floor(Math.random() * pool.length)];
  }

  currentQuestion = q;
  answered = false;
  selectedOption = -1;

  updateScoreDisplay();
  renderQuestion(q);
}

function updateScoreDisplay() {
  const score = scores[currentSection];
  document.getElementById('scoreCorrect').textContent = score.correct;
  document.getElementById('scoreWrong').textContent = score.wrong;
  document.getElementById('scoreAnswered').textContent = score.answered.size;
  const total = score.pool.length || 100;
  const remaining = total - score.answered.size;
  document.getElementById('scoreRemaining').textContent = Math.max(0, remaining);
  const pct = (score.answered.size / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderQuestion(q) {
  const card = document.getElementById('questionCard');
  const score = scores[currentSection];
  const isReview = score.answered.has(q.id);

  let html = `
    <div class="question-number">Question #${q.id} of ${score.pool.length}</div>
    <span class="question-topic">${currentSection}${isReview ? ' (Review)' : ''}</span>
    <p class="question-text">${q.q}</p>
  `;

  if (q.diagram) {
    html += `<div class="question-diagram">${q.diagram}</div>`;
  }

  html += `<div class="options" id="optionsContainer">`;
  q.options.forEach((opt, i) => {
    html += `<div class="option" data-idx="${i}" onclick="selectOption(${i})">${opt}</div>`;
  });
  html += `</div>`;

  html += `
    <div class="btn-row">
      <button class="btn btn-answer" id="btnAnswer" onclick="revealAnswer()" disabled>Show Answer</button>
      <button class="btn btn-next" id="btnNext" onclick="showRandomQuestion()" style="display:none">Next Question</button>
      <button class="btn btn-reset" onclick="resetSection()">Reset Section</button>
    </div>
    <div class="explanation" id="explanation"></div>
  `;

  card.innerHTML = html;
}

function selectOption(idx) {
  if (answered) return;
  selectedOption = idx;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  document.querySelector(`.option[data-idx="${idx}"]`).classList.add('selected');
  document.getElementById('btnAnswer').disabled = false;
}

function revealAnswer() {
  if (answered || selectedOption === -1) return;
  answered = true;

  const q = currentQuestion;
  const score = scores[currentSection];
  const isNew = !score.answered.has(q.id);

  // Mark options
  document.querySelectorAll('.option').forEach(o => {
    o.classList.add('disabled');
    const idx = parseInt(o.dataset.idx);
    if (idx === q.answer) {
      o.classList.add('correct');
    }
    if (idx === selectedOption && idx !== q.answer) {
      o.classList.add('wrong');
    }
  });

  // Update score only for new answers
  if (isNew) {
    score.answered.add(q.id);
    if (selectedOption === q.answer) {
      score.correct++;
    } else {
      score.wrong++;
    }
  }

  updateScoreDisplay();

  // Show explanation
  const expEl = document.getElementById('explanation');
  let expHtml = `
    <h3>${selectedOption === q.answer ? 'Correct!' : 'Incorrect'} - The answer is ${q.options[q.answer]}</h3>
    <p>${q.explanation}</p>
  `;
  if (q.diagram && q.diagram.length > 0) {
    expHtml += `<div class="diagram-explain">${q.diagram}</div>`;
  }
  expEl.innerHTML = expHtml;
  expEl.classList.add('show');

  // Show next button, hide answer button
  document.getElementById('btnAnswer').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-block';
}

function resetSection() {
  if (!currentSection) return;
  scores[currentSection] = { correct: 0, wrong: 0, answered: new Set(), pool: scores[currentSection].pool };
  scores[currentSection].pool = shuffle(scores[currentSection].pool);
  showRandomQuestion();
}

// Auto-select first tab
// selectSection('A1');
</script>

</body>
</html>
